name: Build macOS DMG

on:
  push:
    tags:
      - "v*"
  release:
    types: [published, created]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies & PyInstaller
        run: |
          python3 -m pip install --upgrade pip
          pip install -r backend/requirements.txt pyinstaller

      - name: Install Frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build NikkSlicer_macOS.dmg
        run: |
          chmod +x build_macos_app.sh build_macos_dmg.sh
          ./build_macos_dmg.sh

      - name: Upload macOS DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NikkSlicer_macOS
          path: dist_release/NikkSlicer_macOS.dmg

      - name: Attach to GitHub Release (on tag push or release)
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist_release/NikkSlicer_macOS.dmg
